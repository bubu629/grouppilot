name: Deploy GroupPilot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker (Backend)
        working-directory: apps/worker
        run: npx wrangler deploy

      - name: Build Mini App (Frontend)
        run: npm run build:miniapp

      - name: Deploy Cloudflare Pages (Frontend)
        run: npx wrangler pages deploy apps/miniapp/dist --project-name=grouppilot --branch=production
